[project]
name = "trilium-mcp"
version = "0.1.1"
description = "MCP server for TriliumNext (ETAPI) with first-class Note Map / Relation Map support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trilium-mcp = "trilium_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
